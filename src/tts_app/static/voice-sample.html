<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Readvox Voice Sample</title>
    <link rel="stylesheet" href="/static/styles.css?v=instruction-sample-2" />
  </head>
  <body>
    <main class="app-shell sample-shell">
      <section class="view active-view" aria-labelledby="sample-title">
        <header class="playback-header">
          <a class="secondary-action compact-action link-action" href="/">Back</a>
          <h1 id="sample-title">Voice Sample</h1>
        </header>
        <form id="instruction-sample-form" class="panel sample-panel">
          <div class="option-grid">
            <label class="field-label" for="instruction-language">
              Language
              <select id="instruction-language" aria-label="Language"></select>
            </label>
            <label class="field-label" for="instruction-voice">
              Voice
              <select id="instruction-voice" aria-label="Voice"></select>
            </label>
            <label class="field-label" for="instruction-speed">
              Speed
              <select id="instruction-speed" aria-label="Speech speed"></select>
            </label>
          </div>
          <label class="field-label" for="instruction-model">
            Model
            <select id="instruction-model" aria-label="Instruction model"></select>
          </label>
          <label class="field-label" for="instruction-prompt">
            Instructions
            <textarea id="instruction-prompt" rows="8">Read in a calm long-form audiobook style. Use clear articulation, steady pacing, low vocal fatigue, natural sentence endings, and restrained expressiveness. Avoid theatrical delivery, sales energy, exaggerated intonation, whispering, vocal fry, or sharp news-anchor emphasis.</textarea>
          </label>
          <label class="field-label" for="instruction-text">
            Sample text
            <textarea id="instruction-text" rows="8">This long-form audiobook sample tests whether the voice stays comfortable over dense nonfiction. The reader should handle longer sentences, quoted phrases, commas, and paragraph transitions without sounding rushed, flat, or overly dramatic.</textarea>
          </label>
          <div class="voice-actions">
            <button id="instruction-sample" class="primary-action" type="submit">Sample</button>
            <button id="clear-instruction-samples" class="secondary-action" type="button">Clear samples</button>
          </div>
          <div id="instruction-status" class="status-line" aria-live="polite">Ready</div>
        </form>
        <audio id="instruction-audio" controls></audio>
      </section>
    </main>
    <script type="module" src="/static/instruction-voice-sample.js?v=long-samples-1"></script>
  </body>
</html>
