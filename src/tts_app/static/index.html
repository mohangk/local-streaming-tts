<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Readvox</title>
    <link rel="stylesheet" href="/static/styles.css?v=voice-editor-2" />
  </head>
  <body>
    <main class="app-shell">
      <section id="generate-view" class="view active-view" aria-labelledby="generate-title">
        <h1 id="generate-title">Readvox</h1>
        <div class="mode-tabs" role="tablist" aria-label="Input mode">
          <button id="text-mode" class="mode-tab active" type="button">Text</button>
          <button id="url-mode" class="mode-tab" type="button">URL</button>
          <button id="image-mode" class="mode-tab" type="button">Image</button>
          <button id="draft-images-mode" class="mode-tab" type="button">Draft Images</button>
        </div>
        <form id="generate-form" class="panel">
          <label id="text-label" class="field-label" for="text-input">Text</label>
          <textarea id="text-input" rows="9" aria-label="Text to read aloud"></textarea>
          <label id="url-label" class="field-label hidden" for="url-input">URL</label>
          <input id="url-input" class="hidden" type="url" aria-label="Page URL" />
          <input id="image-upload-input" class="hidden" type="file" accept="image/*" multiple aria-label="Upload images for OCR" />
          <div id="image-actions" class="image-actions hidden">
            <button id="upload-image-files" class="secondary-action" type="button">Upload images</button>
            <button id="clear-ocr-draft" class="warning-action hidden" type="button">Clear images</button>
            <button id="extract-image-text" class="secondary-action hidden" type="button">Extract text</button>
          </div>
          <div id="ocr-upload-progress" class="upload-progress hidden" aria-live="polite">
            <div id="ocr-upload-status" class="upload-status">Preparing images...</div>
            <progress id="ocr-upload-bar" value="0" max="100"></progress>
            <button id="cancel-ocr-upload" class="secondary-action compact-action" type="button">Cancel</button>
          </div>
          <div id="image-selection-list" class="image-selection-list hidden" aria-live="polite"></div>
          <div id="ocr-review-list" class="ocr-review-list hidden"></div>
          <button id="generate-ocr-audio" class="primary-action hidden" type="button">Generate audio</button>
          <div id="ocr-drafts-list" class="history-list hidden"></div>
          <div id="voice-panel" class="voice-panel">
            <label id="ocr-language-field" class="field-label hidden" for="language-select">OCR language
              <select id="language-select" aria-label="OCR language"><option value="en">English</option><option value="zh">Chinese</option></select>
            </label>
            <label class="field-label" for="profile-select">Voice</label>
            <div class="named-voice-row">
              <select id="profile-select" aria-label="Voice"></select>
              <button id="voice-edit" class="secondary-action compact-action" type="button">Edit</button>
            </div>
            <p id="profile-status" class="status-line" aria-live="polite"></p>
          </div>
          <label class="toggle-row">
            <input id="autoplay" type="checkbox" checked />
            <span>Auto-play segments</span>
          </label>
          <button class="primary-action" type="submit">Generate</button>
        </form>
      </section>


      <section id="profile-editor" class="view" aria-labelledby="profile-editor-title">
        <h1 id="profile-editor-title">Edit voice</h1>
        <div class="profile-save-actions">
          <button id="profile-save" class="primary-action" type="button">Save</button>
          <button id="profile-save-as" class="secondary-action" type="button">Save As…</button>
          <button id="profile-cancel" class="secondary-action" type="button">Cancel</button>
        </div>
        <div class="panel">
          <label class="field-label" for="editor-profiles">Saved voice</label>
          <div class="named-voice-row">
            <select id="editor-profiles" aria-label="Saved voice"></select>
            <button id="profile-delete" class="warning-action compact-action" type="button">Delete</button>
          </div>
          <div id="instruction-status" class="status-line" aria-live="polite">Ready</div>
          <label class="field-label" for="profile-name">Name<input type="text" id="profile-name" maxlength="120" required></label>
        </div>
        <form id="instruction-sample-form" class="panel sample-panel">
          <div class="option-grid">
            <label class="field-label" for="instruction-language">
              Language
              <select id="instruction-language" aria-label="Language"></select>
            </label>
            <label class="field-label" for="instruction-voice">
              Base voice
              <select id="instruction-voice" aria-label="Base voice"></select>
            </label>
            <label class="field-label" for="instruction-speed">
              Speed
              <select id="instruction-speed" aria-label="Speech speed"></select>
            </label>
          </div>
          <label class="field-label" for="instruction-model">
            Model
            <select id="instruction-model" aria-label="Instruction model"></select>
          </label>
          <label class="field-label" for="instruction-prompt">
            Instructions
            <textarea id="instruction-prompt" rows="8">Read in a calm long-form audiobook style. Use clear articulation, steady pacing, low vocal fatigue, natural sentence endings, and restrained expressiveness. Avoid theatrical delivery, sales energy, exaggerated intonation, whispering, vocal fry, or sharp news-anchor emphasis.</textarea>
          </label>
          <label class="field-label" for="instruction-text">
            Preview text
            <textarea id="instruction-text" rows="8">This long-form audiobook sample tests whether the voice stays comfortable over dense nonfiction. The reader should handle longer sentences, quoted phrases, commas, and paragraph transitions without sounding rushed, flat, or overly dramatic.</textarea>
          </label>
          <div class="voice-actions">
            <button id="instruction-sample" class="primary-action" type="submit">Preview</button>
            <button id="clear-instruction-samples" class="secondary-action" type="button">Clear samples</button>
          </div>
        </form>
        <audio id="instruction-audio" controls></audio>
      </section>

      <section id="history-view" class="view" aria-labelledby="history-title">
        <h1 id="history-title">History</h1>
        <input id="history-search" class="search-input" type="search" aria-label="Search history" />
        <div id="history-list" class="history-list"></div>
      </section>

      <section id="playback-view" class="view playback-view" aria-labelledby="playback-title">
        <header class="playback-header">
          <button id="back-to-history" class="secondary-action" type="button">Back</button>
          <h1 id="playback-title">Playback</h1>
        </header>
        <div class="player-bar">
          <button id="play-pause" class="primary-action" type="button">Play</button>
          <div>
            <div id="player-status">No segment selected</div>
            <label class="toggle-row compact">
              <input id="scroll-follow" type="checkbox" checked />
              <span>Follow text</span>
            </label>
          </div>
        </div>
        <article id="reading-pane" class="reading-pane"></article>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Primary">
      <button data-view="generate-view" class="nav-button active" type="button">Generate</button>
      <button data-view="history-view" class="nav-button" type="button">History</button>
    </nav>

    <div id="image-preview-overlay" class="image-preview-overlay hidden" aria-hidden="true">
      <div class="image-preview-dialog" role="dialog" aria-modal="true" aria-label="Image preview">
        <button id="image-preview-close" class="secondary-action compact-action image-preview-close" type="button" aria-label="Close image preview">Close</button>
        <img id="image-preview-image" class="image-preview-image" alt="" />
      </div>
    </div>

    <audio id="audio-player"></audio>
    <script type="module" src="/static/app.js?v=voice-editor-2"></script>
  </body>
</html>
